name: demo-otel-php

# Rotação dos logs dos containers (o json-file do Docker não tem limite por padrão)
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    logging: *logging
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: demo-otel-php-app
    environment:
      # --- OpenTelemetry (lido pelo SDK no autoload, antes do .env do Laravel) ---
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      # true desliga o SDK inteiro (útil para medir o overhead da instrumentação)
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: demo-pedidos
      # Tags de versão e ambiente (no Datadog viram `version` e `env`). O `make deploy`
      # troca APP_VERSION para simular um deploy e comparar erros por versão no dashboard.
      OTEL_RESOURCE_ATTRIBUTES: service.version=${APP_VERSION:-1.0.0},deployment.environment.name=demo
      PAGAMENTO_TAXA_ERRO: ${PAGAMENTO_TAXA_ERRO:-20}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      # Logs: o auto-laravel escuta o evento MessageLogged e exporta cada Log::info/error
      # (e as exceções reportadas pelo handler) como LogRecord OTLP, já com trace_id e
      # span_id do span ativo -> Collector -> Loki
      OTEL_LOGS_EXPORTER: otlp
      # O psr3 em modo export duplicaria os mesmos logs; fica desligado
      OTEL_PHP_DISABLED_INSTRUMENTATIONS: psr3
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    depends_on:
      mysql:
        condition: service_healthy
      collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && test -f bootstrap/cache/routes-v7.php"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  nginx:
    logging: *logging
    image: nginx:1.30.6-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    logging: *logging
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -udemo -pdemo --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  collector:
    logging: *logging
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      COLLECTOR_DEBUG_VERBOSITY: ${COLLECTOR_DEBUG_VERBOSITY:-basic}
    volumes:
      - ./docker/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - tempo
      - loki

  loki:
    logging: *logging
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    logging: *logging
    image: grafana/tempo:3.0.4
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    logging: *logging
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # guarda os exemplars (trace_id) que o spanmetrics anexa aos histogramas
      - --enable-feature=exemplar-storage
      # Retenção: 3 dias ou 512 MB, o que vier primeiro
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - collector

  grafana:
    logging: *logging
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - tempo
      - prometheus
      - loki

volumes:
  mysql-data:
  tempo-data:
  prometheus-data:
  loki-data:

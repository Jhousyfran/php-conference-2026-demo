receivers:
  otlp:
    protocols:
      http:
        # Recebe OTLP/HTTP da aplicação PHP
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

# span_metrics: transforma cada span em métricas RED (Rate, Errors, Duration).
# Nenhuma métrica é emitida pelo PHP: tudo sai dos traces que já chegam aqui.
connectors:
  span_metrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 75ms, 100ms, 150ms, 200ms, 300ms, 500ms, 1s, 2s]
    dimensions:
      - name: http.route
      - name: http.request.method
      - name: http.response.status_code
      # resource attribute (OTEL_RESOURCE_ATTRIBUTES): erros e latência por versão
      - name: service.version
    # Exemplars: cada ponto do histograma guarda um trace_id (clique no gráfico -> trace)
    exemplars:
      enabled: true
    metrics_flush_interval: 5s
    # Cada worker do PHP-FPM tem um process.pid diferente no resource. Sem isto o
    # connector cria um contador por pid, o exporter Prometheus (que não tem pid como
    # label) junta as séries e só uma sobrevive: com 2 workers, metade das requests sumia.
    resource_metrics_key_attributes:
      - service.name
      - service.version
      - deployment.environment.name

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Exporter de debug: imprime no log do collector.
  # basic    -> uma linha por lote (padrão, quase silencioso)
  # detailed -> cada span com atributos (ex.: COLLECTOR_DEBUG_VERBOSITY=detailed make up)
  # Métricas expostas em :8889/metrics para o Prometheus fazer scrape.
  # OpenMetrics é necessário para os exemplars saírem junto.
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true

  # Logs OTLP (com trace_id/span_id) para o endpoint OTLP nativo do Loki
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

  debug:
    verbosity: ${env:COLLECTOR_DEBUG_VERBOSITY:-basic}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo, span_metrics, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki, debug]
    metrics:
      receivers: [span_metrics]
      exporters: [prometheus]

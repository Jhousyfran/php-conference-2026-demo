# Tempo em modo single binary (-target=all), armazenamento local.
# Baseado em example/docker-compose/single-binary/tempo.yaml da tag v3.0.4.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false

# Retenção: blocos com mais de 48 h são apagados (o padrão do Tempo 3 é 14 dias).
# No Tempo 3 a compactação/retenção fica no backend-scheduler e no backend-worker.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 48h

backend_worker:
  compaction:
    block_retention: 48h

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
    jsonData:
      timeInterval: 5s
      # Clique num exemplar (ponto no gráfico de latência) -> abre o trace no Tempo
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

server {
    listen 80;
    server_name _;

    # DNS interno do Docker: resolve "app" a cada request, assim o nginx
    # continua funcionando se o container do PHP for recriado.
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;

    # Toda request vai para o front controller do Laravel no container "app".
    location / {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }
}

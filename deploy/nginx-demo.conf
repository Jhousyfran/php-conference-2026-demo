# nginx da VM: https://demo.deploypro.com.br -> Grafana da demo (127.0.0.1:3101).
# Instalado pelo scripts/deploy-vm.sh depois do `certbot certonly` (o certbot não edita
# este arquivo; a renovação só troca os .pem).
map $http_upgrade $demo_connection_upgrade {
    default upgrade;
    ''      close;
}

# Por IP: um navegador comum com o dashboard aberto fica bem abaixo disso
limit_req_zone $binary_remote_addr zone=demo_por_ip:10m rate=20r/s;
# Teto GLOBAL das queries de dados (/api/ds/query): se a plateia inteira abrir o
# dashboard, alguns painéis recebem 429, mas a VM (e os outros sites dela) não cai
limit_req_zone $server_name zone=demo_queries:1m rate=40r/s;

server {
    listen 443 ssl;
    server_name demo.deploypro.com.br;

    ssl_certificate /etc/letsencrypt/live/demo.deploypro.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.deploypro.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    limit_req_status 429;

    location / {
        limit_req zone=demo_por_ip burst=60 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ds/query {
        limit_req zone=demo_queries burst=80 nodelay;
        limit_req zone=demo_por_ip burst=60 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live (websocket)
    location /api/live/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $demo_connection_upgrade;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name demo.deploypro.com.br;
    return 301 https://$host$request_uri;
}
